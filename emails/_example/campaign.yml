# DAILY TEMPLATE — copy this folder to emails/<today>/ each morning.
#
# YOUR PATTERN:
#   - You have several "sets" per day.
#   - Each set is DIFFERENT: its own subject, its own content, its own 3-4 Bcc.
#   - Each set is sent as its OWN separate email (sets are never merged).
#
# So: one "- " entry per set. Give each its own subject, its own body file
# (create body1.html, body2.html, ... in this folder), and its own bcc list.
# The resume (assets/AkashGupta_Resume.pdf) attaches to every send automatically.
#
# Add or remove entries to match how many sets you have that day.

emails:
  # ---- Set 1 ----
  - subject: "Subject for set 1"
    body: "body1.html"            # this set's content (a file in this folder)
    bcc:
      - "a1@example.com"
      - "a2@example.com"
      - "a3@example.com"

  # ---- Set 2 ----
  - subject: "Subject for set 2"
    body: "body2.html"            # different content
    bcc:
      - "b1@example.com"
      - "b2@example.com"
      - "b3@example.com"
      - "b4@example.com"

  # ---- Set 3 ----
  - subject: "Subject for set 3"
    body: "body3.html"            # different content
    bcc:
      - "c1@example.com"
      - "c2@example.com"
      - "c3@example.com"
