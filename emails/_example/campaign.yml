# DAILY TEMPLATE — copy this folder to emails/<today>/ each morning.
#
# YOUR PATTERN:
#   - You have several "sets" of 3-4 Bcc emails.
#   - Every set gets the SAME subject and SAME content (body.html).
#   - Each set must be sent as its OWN separate email (sets are never merged).
#
# So: one "- " entry per set. Reuse the same subject + same body file for all of
# them, and just change the "bcc:" list. The resume attaches to every send.
#
# Add or remove entries to match how many sets you have that day (e.g. 5-10).

emails:
  # ---- Set 1 ----
  - subject: "Your subject line here"
    body: "body.html"
    bcc:
      - "person1@example.com"
      - "person2@example.com"
      - "person3@example.com"
      - "person4@example.com"

  # ---- Set 2 ---- (same subject + body, different recipients)
  - subject: "Your subject line here"
    body: "body.html"
    bcc:
      - "person5@example.com"
      - "person6@example.com"
      - "person7@example.com"

  # ---- Set 3 ----
  - subject: "Your subject line here"
    body: "body.html"
    bcc:
      - "person8@example.com"
      - "person9@example.com"
      - "person10@example.com"
      - "person11@example.com"
